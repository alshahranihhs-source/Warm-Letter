 تشعرين بالتعب تذكّري لماذا بدأتِ. وجودكِ في هذا الصف نعمة، وأحلامكِ تستحق كل ما تبذلينه من أجلها."}, {"n": "نوره مبارك", "m": "{name}، أرى فيكِ طالبة تتعلم بقلبها وعقلها معًا. كل سؤال تطرحينه دليل على ذكاءٍ حي، فلا تتوقفي عن السؤال أبدًا."}, {"n": "وضحى  جاسم", "m": "{name}، اجتهادكِ الهادئ يصل إلى القلوب قبل الدرجات. استمري بجهدكِ المنتظم، فالمثابرة تصنع ما لا تصنعه الموهبة وحدها."}, {"n": "يقين  خالد", "m": "{name}، طموحكِ جميل ويستحق أن تسعي إليه. احلمي بجرأة، وارسمي لنفسكِ طريقًا واضحًا، وسترين كيف يفتح لكِ الله الأبواب بابًا بعد باب."}, {"n": "شيخه السبيعي", "m": "{name}، اجتهادكِ الهادئ يصل إلى القلوب قبل الدرجات. استمري بجهدكِ المنتظم، فالمثابرة تصنع ما لا تصنعه الموهبة وحدها."}, {"n": "شهد صبري", "m": "{name}، أرى فيكِ طالبة تتعلم بقلبها وعقلها معًا. كل سؤال تطرحينه دليل على ذكاءٍ حي، فلا تتوقفي عن السؤال أبدًا."}]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase();
const pick=a=>a[Math.floor(Math.random()*a.length)];
const first=n=>String(n).trim().split(/\s+/)[0]||'';
const fill=(m,n)=>String(m).replace(/\{name\}/g,first(n));
function find(q){const t=norm(q).split(' ').filter(Boolean);if(!t.length)return null;
  let e=S.list.find(s=>norm(s.n)===t.join(' '));if(e)return e;
  return S.list.find(s=>{const w=norm(s.n).split(' ');return t.every(x=>w.includes(x))})||null}
function card(n,m){const sig='معلمتكِ: '+'الأستاذة '+esc(S.teacher||'حلا الشهراني')+' 💌';
  return '<p class="nm">'+esc(n)+'</p><h3>'+TITLE+'</h3><p>'+esc(m)+'</p><p class="end">'+END+'</p><div class="sig">'+sig+'</div>'}
// background
(function(){const b=$('bg'),e=['💖','✨','⭐','💌','🌸','💜'];for(let i=0;i<18;i++){const s=document.createElement('span');s.textContent=e[i%e.length];s.style.left=Math.random()*100+'%';s.style.fontSize=(14+Math.random()*20)+'px';s.style.animationDuration=(9+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';b.appendChild(s)}})();
// public
function show(){const q=$('nm').value;if(!q.trim()){$('nm').focus();return}
  const s=find(q);const name=s?s.n:q.trim();
  const msg=s&&s.m&&s.m.trim()?fill(s.m,s.n):fill(pick(GEN),q);
  const st=$('stage');st.innerHTML='<div class="env" id="env"><div class="flap"></div><div class="seal">💖</div></div>';
  setTimeout(()=>{$('env').classList.add('open');const d=document.createElement('div');d.className='letter';d.innerHTML=card(name,msg);st.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'center'})},900)}
$('find').onclick=show;$('nm').onkeydown=e=>{if(e.key==='Enter')show()};
// teacher
$('tbtn').onclick=()=>{$('panel').style.display='block';login()};
function close(){$('panel').style.display='none';$('pin').innerHTML=''}
function login(){$('pin').innerHTML='<div class="box" style="max-width:360px;margin:60px auto;text-align:center"><h2>لوحة المعلمة 🔒</h2><input id="pw" type="password" placeholder="رمز الدخول"><div class="btns" style="justify-content:center"><button id="ok">دخول</button><button class="ghost" id="cl">إغلاق</button></div><p class="note" id="er"></p><p class="note">الرمز الافتراضي: 1234 — غيّريه بعد الدخول.</p></div>';
  $('cl').onclick=close;const go=()=>{if($('pw').value===S.code)panel();else $('er').textContent='الرمز غير صحيح'};$('ok').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()}}
function panel(){
  $('pin').innerHTML='<div class="tools" style="justify-content:space-between"><h2 style="margin:0">لوحة المعلمة 💌</h2><button class="ghost sm" id="cl">إغلاق</button></div>'
  +'<div class="row"><div class="tools"><input id="tn" style="flex:1;min-width:160px" placeholder="اسمكِ للتوقيع" value="'+esc(S.teacher)+'"><input id="pc" style="flex:1;min-width:120px" placeholder="رمز دخول جديد" value="'+esc(S.code)+'"></div>'
  +'<p class="note">تُحفظ البيانات في هذا المتصفح. استخدمي «تصدير» للنسخ الاحتياطي.</p></div>'
  +'<div class="row"><b>إضافة دفعة واحدة</b><p class="note">اسم في كل سطر، أو «الاسم، الرسالة». يمكن أيضًا رفع ملف CSV.</p><textarea id="bulk" rows="3"></textarea><div class="btns"><button class="sm" id="addb">إضافة</button><button class="sm ghost" id="addone">+ طالبة جديدة</button><input type="file" id="csv" accept=".csv,.txt" style="width:auto"></div></div>'
  +'<div class="tools"><button class="sm" id="rall">رسائل عشوائية للفارغة</button><button class="sm ghost" id="exp">تصدير CSV</button><button class="sm ghost" id="prt">طباعة البطاقات</button></div>'
  +'<p class="note">عدد الطالبات: '+S.list.length+'</p><div id="rows"></div><textarea id="out" rows="4" style="display:none;margin-top:10px"></textarea>';
  rows();$('cl').onclick=close;
  $('tn').oninput=e=>{S.teacher=e.target.value;save()};
  $('pc').onchange=e=>{if(e.target.value.trim()){S.code=e.target.value.trim();save()}};
  $('addone').onclick=()=>{S.list.unshift({n:'',m:''});save();panel()};
  $('addb').onclick=()=>{addText($('bulk').value);panel()};
  $('csv').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{addText(String(r.result));panel()};r.readAsText(f,'utf-8')};
  $('rall').onclick=()=>{S.list.forEach(s=>{if(!s.m.trim())s.m=pick(LIB)});save();panel()};
  $('exp').onclick=exportCsv;$('prt').onclick=printCards}
function addText(t){String(t).replace(/^\uFEFF/,'').split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;const i=l.search(/[,،\t]/);let n=i<0?l:l.slice(0,i),m=i<0?'':l.slice(i+1);n=n.replace(/^"|"$/g,'').trim();m=m.replace(/^"|"$/g,'').trim();if(n&&!S.list.some(s=>norm(s.n)===norm(n)))S.list.push({n,m})});save()}
function rows(){$('rows').innerHTML=S.list.map((s,i)=>'<div class="row"><input data-i="'+i+'" data-f="n" placeholder="اسم الطالبة" value="'+esc(s.n)+'"><textarea data-i="'+i+'" data-f="m" rows="3" placeholder="الرسالة (يمكن استخدام {name} لاسمها الأول)">'+esc(s.m)+'</textarea><div class="btns"><button class="sm" data-a="r" data-i="'+i+'">🎲 عشوائية</button><button class="sm ghost" data-a="p" data-i="'+i+'">معاينة</button><button class="sm del" data-a="d" data-i="'+i+'">حذف</button></div></div>').join('')}
$('pin').addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(i!==undefined&&t.dataset.f){S.list[i][t.dataset.f]=t.value;save()}});
$('pin').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.dataset.i,s=S.list[i];
  if(b.dataset.a==='r'){s.m=pick(LIB);save();rows()}
  else if(b.dataset.a==='d'){if(confirm('حذف هذه الطالبة؟')){S.list.splice(i,1);save();panel()}}
  else{const m=$('modal');m.innerHTML='<div class="letter">'+card(s.n||'اسم الطالبة',fill(s.m||pick(GEN),s.n))+'<div class="btns" style="justify-content:center"><button class="sm" id="mc">إغلاق</button></div></div>';m.style.display='flex';$('mc').onclick=()=>m.style.display='none'}});
function exportCsv(){const t='\uFEFF'+S.list.map(s=>'"'+s.n.replace(/"/g,'""')+'","'+s.m.replace(/"/g,'""')+'"').join('\n');
  const o=$('out');o.style.display='block';o.value=t;o.select();
  claude.use('downloads').then(d=>{if(d)return d.save({filename:'risail.csv',data:t})}).catch(()=>{})}
function printCards(){$('prints').innerHTML=S.list.map(s=>'<div class="pc">'+card(s.n,fill(s.m||pick(GEN),s.n))+'</div>').join('');try{window.print()}catch(e){}}
</script>
